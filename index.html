<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5fb">
  <title>Orbit — Space Exploration Quiz</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      --page: #f4f5fb;
      --surface: #fff;
      --surface-soft: #f7f7fc;
      --ink: #1d2140;
      --muted: #767b98;
      --line: #e8e9f2;
      --accent: #6558e8;
      --accent-dark: #5144d1;
      --accent-soft: #efedff;
      --green: #138a61;
      --green-soft: #e6f7ef;
      --red: #d7475c;
      --red-soft: #fff0f1;
      --shadow: 0 20px 60px rgb(38 42 82 / 9%), 0 3px 10px rgb(38 42 82 / 4%);
      --display-edge: #d6d1ff;
      --display-face: #f2f0ff;
      --display-core: rgb(255 255 255 / 85%);
      --display-scanline: rgb(83 70 173 / 4%);
      --display-glow: rgb(119 103 242 / 16%);
      --display-shadow: rgb(61 53 132 / 10%);
      --display-reticle: rgb(98 84 205 / 26%);
      --display-reticle-halo: rgb(104 91 219 / 5%);
      --display-label: #67618e;
      --display-signal: #138a61;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 12%, rgb(135 122 255 / 13%), transparent 29rem),
        radial-gradient(ellipse at 88% 88%, rgb(89 196 219 / 11%), transparent 27rem),
        var(--page);
      transition: background-color 180ms ease, color 180ms ease;
    }

    button { font: inherit; }

    .app { width: min(100%, 560px); }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 12px;
      color: white;
      background: linear-gradient(145deg, #8176ff, #574bd4);
      box-shadow: 0 5px 14px rgb(101 88 232 / 28%);
      font-size: 1rem;
      letter-spacing: 0;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 70%);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-inner { padding: clamp(24px, 6vw, 38px); }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 650;
    }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: var(--surface-soft);
      white-space: nowrap;
    }

    .score-pill span { color: #e3a329; }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--line);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8176ff, #5c4de1);
      transition: width 450ms cubic-bezier(.2, .75, .25, 1);
    }

    .eyebrow {
      margin: 30px 0 9px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 750;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      max-width: 440px;
      margin-bottom: 24px;
      font-size: clamp(1.45rem, 4vw, 1.85rem);
      line-height: 1.3;
      letter-spacing: -0.035em;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--ink);
      background: var(--surface);
      text-align: left;
      cursor: pointer;
      transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #b8b1ff;
      background: var(--accent-soft);
    }

    .answer:focus-visible, .primary-button:focus-visible {
      outline: 3px solid rgb(101 88 232 / 38%);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-key {
      flex: 0 0 28px;
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 0.78rem;
      font-weight: 700;
      transition: inherit;
    }

    .answer.correct {
      border-color: #75c9a7;
      color: var(--green);
      background: var(--green-soft);
      animation: pop 360ms ease both;
    }

    .answer.correct .answer-key {
      border-color: transparent;
      color: white;
      background: var(--green);
    }

    .answer.wrong {
      border-color: #ef9ba6;
      color: var(--red);
      background: var(--red-soft);
      animation: shake 380ms ease both;
    }

    .answer.wrong .answer-key {
      border-color: transparent;
      color: white;
      background: var(--red);
    }

    .feedback {
      min-height: 25px;
      margin: 17px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    .footer {
      min-height: 49px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 17px;
    }

    .hint { margin: 0; color: var(--muted); font-size: 0.78rem; }

    .primary-button {
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 14px rgb(101 88 232 / 23%);
      transition: background-color 150ms ease, transform 150ms ease;
    }

    .primary-button:hover { transform: translateY(-1px); background: var(--accent-dark); }
    .primary-button:active { transform: translateY(0); }

    .result { padding: clamp(32px, 7vw, 48px) clamp(24px, 6vw, 38px); text-align: center; }

    .result-emoji {
      position: relative;
      isolation: isolate;
      width: 132px;
      height: 132px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin: 0 auto 20px;
      overflow: hidden;
      border: 1px solid var(--display-edge);
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 49%, var(--display-core), transparent 39%),
        repeating-linear-gradient(0deg, transparent 0 5px, var(--display-scanline) 5px 6px),
        linear-gradient(145deg, var(--display-face), var(--accent-soft));
      box-shadow:
        inset 0 1px 0 rgb(255 255 255 / 65%),
        inset 0 0 24px var(--display-glow),
        0 9px 22px var(--display-shadow);
      animation: float-in 500ms cubic-bezier(.2, .8, .3, 1.2) both;
    }

    .result-emoji::before {
      position: absolute;
      z-index: -1;
      width: 78px;
      height: 78px;
      border: 1px solid var(--display-reticle);
      border-radius: 50%;
      background:
        linear-gradient(var(--display-reticle), var(--display-reticle)) center / 1px 100% no-repeat,
        linear-gradient(90deg, var(--display-reticle), var(--display-reticle)) center / 100% 1px no-repeat;
      content: "";
      box-shadow: 0 0 0 7px var(--display-reticle-halo), 0 0 22px var(--display-glow);
    }

    .result-emoji::after {
      position: absolute;
      top: 9px;
      right: 10px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--display-signal);
      content: "";
      box-shadow: 0 0 8px var(--display-signal);
      animation: signal-pulse 1.8s ease-in-out infinite;
    }

    .display-label,
    .display-status {
      z-index: 1;
      color: var(--display-label);
      font-size: 0.52rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      line-height: 1;
      text-transform: uppercase;
    }

    .display-label { margin-bottom: 1px; }

    .emoji-glyph {
      z-index: 1;
      font-size: 3.15rem;
      line-height: 1.1;
      filter: drop-shadow(0 3px 4px rgb(22 27 63 / 18%));
    }

    .display-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
      color: var(--display-signal);
      font-size: 0.48rem;
    }

    .display-status::before {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .result .eyebrow { margin: 0 0 8px; }
    .result h1 { margin: 0 auto 10px; }
    .result-copy { margin: 0 0 25px; color: var(--muted); }

    .result-score {
      width: fit-content;
      margin: 0 auto 25px;
      padding: 12px 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-soft);
      font-size: 1rem;
      font-weight: 700;
    }

    .result-score strong { color: var(--accent); font-size: 1.25rem; }

    [hidden] { display: none !important; }

    @keyframes pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    @keyframes float-in {
      from { opacity: 0; transform: translateY(12px) scale(.82); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes signal-pulse {
      50% { opacity: .45; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111321;
        --surface: #1c1f30;
        --surface-soft: #25283a;
        --ink: #f0f1fb;
        --muted: #a2a6c0;
        --line: #34374c;
        --accent: #938aff;
        --accent-dark: #7e73f0;
        --accent-soft: #302d50;
        --green: #6cdbad;
        --green-soft: #1d3b34;
        --red: #ff8795;
        --red-soft: #462a35;
        --shadow: 0 22px 70px rgb(0 0 0 / 32%), 0 3px 10px rgb(0 0 0 / 12%);
        --display-edge: #58517e;
        --display-face: #20233b;
        --display-core: rgb(145 134 255 / 17%);
        --display-scanline: rgb(218 215 255 / 4%);
        --display-glow: rgb(130 117 255 / 18%);
        --display-shadow: rgb(0 0 0 / 25%);
        --display-reticle: rgb(195 190 255 / 30%);
        --display-reticle-halo: rgb(145 134 255 / 4%);
        --display-label: #c4c0ef;
        --display-signal: #81e4ba;
      }

      .card { border-color: rgb(255 255 255 / 5%); }
      .brand-mark { background: linear-gradient(145deg, #8e84ff, #6255df); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand" aria-label="Orbit space quiz">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>Orbit · Space exploration quiz</span>
    </div>

    <section class="card" id="quiz-card" aria-live="polite">
      <div class="card-inner" id="quiz-view">
        <div class="topline">
          <span id="question-count">Question 1 of 10</span>
          <span class="score-pill"><span aria-hidden="true">★</span> Score <strong id="score">0</strong></span>
        </div>
        <div
          class="progress-track"
          id="progress-track"
          role="progressbar"
          aria-label="Quiz progress"
          aria-valuemin="0"
          aria-valuemax="10"
          aria-valuenow="0"
        >
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="eyebrow" id="category">The solar system</p>
        <h1 id="question" tabindex="-1">Loading question…</h1>
        <div class="answers" id="answers" role="group" aria-label="Answer choices"></div>
        <p class="feedback" id="feedback" aria-live="assertive"></p>
        <div class="footer">
          <p class="hint" id="hint">Choose the best answer to continue.</p>
          <button class="primary-button" id="next-button" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
        </div>
      </div>

      <div class="result" id="result-view" hidden>
        <div class="result-emoji" id="result-emoji" role="img" aria-label="Rocket: stellar work">
          <span class="display-label" aria-hidden="true">Mission // debrief</span>
          <span class="emoji-glyph" id="result-glyph" aria-hidden="true">🚀</span>
          <span class="display-status" aria-hidden="true">Mission complete</span>
        </div>
        <p class="eyebrow">Mission complete</p>
        <h1 id="result-title" tabindex="-1">Stellar work!</h1>
        <p class="result-copy" id="result-copy">You made it across the cosmos.</p>
        <p class="result-score">Your score: <strong id="final-score">0 / 10</strong></p>
        <button class="primary-button" id="restart-button" type="button">Play again <span aria-hidden="true">↻</span></button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        category: "The solar system",
        question: "Which planet is known as the Red Planet?",
        answers: ["Venus", "Mars", "Jupiter", "Mercury"],
        correct: 1,
        fact: "Mars gets its rusty color from iron-rich dust on its surface."
      },
      {
        category: "Moon missions",
        question: "What was the name of the first crewed mission to land on the Moon?",
        answers: ["Apollo 8", "Gemini 4", "Apollo 11", "Artemis I"],
        correct: 2,
        fact: "Apollo 11 landed on the Moon on July 20, 1969."
      },
      {
        category: "Far-off worlds",
        question: "Which planet has the most prominent ring system?",
        answers: ["Neptune", "Saturn", "Uranus", "Jupiter"],
        correct: 1,
        fact: "Saturn's rings are made mostly of countless pieces of ice and rock."
      },
      {
        category: "Deep space",
        question: "What is the name of the galaxy that contains our Solar System?",
        answers: ["Andromeda", "Whirlpool", "Sombrero", "Milky Way"],
        correct: 3,
        fact: "Our Solar System sits in one of the Milky Way's spiral arms."
      },
      {
        category: "Space technology",
        question: "What does a telescope primarily collect to help us see distant objects?",
        answers: ["Sound waves", "Light", "Magnetic fields", "Dust"],
        correct: 1,
        fact: "Telescopes gather and focus light from faraway objects."
      },
      {
        category: "The Moon",
        question: "About how long does the Moon take to orbit Earth once?",
        answers: ["One day", "One week", "One month", "One year"],
        correct: 2,
        fact: "One orbit takes about 27.3 days; lunar phases repeat about every 29.5 days."
      },
      {
        category: "Our star",
        question: "What is the Sun mostly made of?",
        answers: ["Hydrogen and helium", "Oxygen and nitrogen", "Iron and nickel", "Carbon and silicon"],
        correct: 0,
        fact: "The Sun is a giant ball of hot plasma, made mostly of hydrogen and helium."
      },
      {
        category: "Space exploration",
        question: "Which rover became the first to explore Mars?",
        answers: ["Curiosity", "Perseverance", "Sojourner", "Spirit"],
        correct: 2,
        fact: "The small Sojourner rover explored Mars in 1997."
      },
      {
        category: "Cosmic scale",
        question: "Which of these is the largest known type of structure in the universe?",
        answers: ["A solar system", "A galaxy", "A galaxy cluster", "A galaxy supercluster"],
        correct: 3,
        fact: "Superclusters are enormous groupings of galaxy clusters."
      },
      {
        category: "Beyond Earth",
        question: "What is the name of the boundary where a black hole's gravity prevents even light from escaping?",
        answers: ["The corona", "The event horizon", "The asteroid belt", "The terminator"],
        correct: 1,
        fact: "Past a black hole's event horizon, nothing can escape back out."
      }
    ];

    const quizView = document.getElementById("quiz-view");
    const resultView = document.getElementById("result-view");
    const questionCount = document.getElementById("question-count");
    const scoreDisplay = document.getElementById("score");
    const progressTrack = document.getElementById("progress-track");
    const progressFill = document.getElementById("progress-fill");
    const categoryDisplay = document.getElementById("category");
    const questionDisplay = document.getElementById("question");
    const answersDisplay = document.getElementById("answers");
    const feedbackDisplay = document.getElementById("feedback");
    const nextButton = document.getElementById("next-button");
    const hint = document.getElementById("hint");
    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      const item = questions[currentQuestion];
      answered = false;
      questionCount.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      scoreDisplay.textContent = score;
      categoryDisplay.textContent = item.category;
      questionDisplay.textContent = item.question;
      feedbackDisplay.textContent = "";
      feedbackDisplay.className = "feedback";
      hint.textContent = "Choose the best answer to continue.";
      nextButton.hidden = true;
      progressTrack.setAttribute("aria-valuenow", currentQuestion);
      progressFill.style.width = `${(currentQuestion / questions.length) * 100}%`;
      answersDisplay.replaceChildren();

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.dataset.index = index;
        button.setAttribute("aria-label", `${String.fromCharCode(65 + index)}. ${answer}`);
        const key = document.createElement("span");
        key.className = "answer-key";
        key.setAttribute("aria-hidden", "true");
        key.textContent = String.fromCharCode(65 + index);
        const label = document.createElement("span");
        label.textContent = answer;
        button.append(key, label);
        button.addEventListener("click", () => chooseAnswer(index));
        answersDisplay.append(button);
      });
    }

    function chooseAnswer(selectedIndex) {
      if (answered) return;
      answered = true;
      const item = questions[currentQuestion];
      const buttons = [...answersDisplay.querySelectorAll(".answer")];
      buttons.forEach((button) => {
        button.disabled = true;
        if (Number(button.dataset.index) === item.correct) button.classList.add("correct");
      });

      if (selectedIndex === item.correct) {
        score += 1;
        scoreDisplay.textContent = score;
        feedbackDisplay.textContent = `Correct! ${item.fact}`;
        feedbackDisplay.classList.add("good");
      } else {
        buttons[selectedIndex].classList.add("wrong");
        feedbackDisplay.textContent = `Not quite. ${item.fact}`;
        feedbackDisplay.classList.add("bad");
      }

      hint.textContent = "";
      progressTrack.setAttribute("aria-valuenow", currentQuestion + 1);
      progressFill.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      nextButton.innerHTML = currentQuestion === questions.length - 1
        ? 'See your results <span aria-hidden="true">→</span>'
        : 'Next question <span aria-hidden="true">→</span>';
      nextButton.hidden = false;
      nextButton.focus();
    }

    function showResults() {
      quizView.hidden = true;
      resultView.hidden = false;
      document.getElementById("final-score").textContent = `${score} / ${questions.length}`;
      const ratio = score / questions.length;
      const result = ratio === 1
        ? { emoji: "🏆", label: "Trophy: perfect mission", title: "Out of this world!", copy: "A perfect mission. You're a true space explorer." }
        : ratio >= 0.7
          ? { emoji: "🚀", label: "Rocket: stellar work", title: "Stellar work!", copy: "You know your way around the cosmos." }
          : ratio >= 0.4
            ? { emoji: "🪐", label: "Ringed planet: nice orbit", title: "Nice orbit!", copy: "A little more exploring and you'll be a star." }
            : { emoji: "🌟", label: "Glowing star: curious astronaut", title: "Curious astronaut!", copy: "Every great explorer starts with a first mission." };
      const resultEmoji = document.getElementById("result-emoji");
      resultEmoji.setAttribute("aria-label", result.label);
      document.getElementById("result-glyph").textContent = result.emoji;
      document.getElementById("result-title").textContent = result.title;
      document.getElementById("result-copy").textContent = result.copy;
      document.getElementById("result-title").focus();
    }

    nextButton.addEventListener("click", () => {
      if (currentQuestion === questions.length - 1) {
        showResults();
        return;
      }
      currentQuestion += 1;
      renderQuestion();
      questionDisplay.focus();
    });

    document.getElementById("restart-button").addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      resultView.hidden = true;
      quizView.hidden = false;
      renderQuestion();
      answersDisplay.querySelector("button")?.focus();
    });

    renderQuestion();
  </script>
</body>
</html>
